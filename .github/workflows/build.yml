name: Build executables

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build NexusHotel
        run: pyinstaller NexusHotel.spec --distpath dist

      - name: Build SeedNexusData
        run: pyinstaller SeedNexusData.spec --distpath dist

      # --- Rename and package per OS ---
      - name: Rename executables (Windows)
        if: runner.os == 'Windows'
        run: |
          ren dist\NexusHotel.exe NexusHotel-${{ github.ref_name }}.exe
          ren dist\SeedNexusData.exe SeedNexusData-${{ github.ref_name }}.exe

      - name: Rename executables (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/NexusHotel dist/NexusHotel-${{ github.ref_name }}
          mv dist/SeedNexusData dist/SeedNexusData-${{ github.ref_name }}

      - name: Package and rename .app (macOS)
        if: runner.os == 'macOS'
        run: |
          # Create zip files for each .app
          cd dist
          zip -r NexusHotel-${{ github.ref_name }}.app.zip NexusHotel.app
          zip -r SeedNexusData-${{ github.ref_name }}.app.zip SeedNexusData.app
          # Remove the original .app folders so they aren't uploaded
          rm -rf NexusHotel.app SeedNexusData.app
          cd ..

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
