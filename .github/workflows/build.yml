name: Build executables

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build NexusHotel
        run: pyinstaller NexusHotel.spec --distpath dist

      - name: Build SeedNexusData
        run: pyinstaller SeedNexusData.spec --distpath dist

      - name: Rename executables (Windows)
        if: runner.os == 'Windows'
        run: |
          ren dist\NexusHotel.exe "NexusHotel-${{ github.ref_name }}-${{ runner.arch }}.exe"
          ren dist\SeedNexusData.exe "SeedNexusData-${{ github.ref_name }}-${{ runner.arch }}.exe"

      - name: Rename executables (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/NexusHotel "NexusHotel-${{ github.ref_name }}-${{ runner.arch }}"
          mv dist/SeedNexusData "SeedNexusData-${{ github.ref_name }}-${{ runner.arch }}"

      - name: Package and rename .app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "NexusHotel-${{ github.ref_name }}-${{ runner.arch }}.app.zip" NexusHotel.app
          zip -r "SeedNexusData-${{ github.ref_name }}-${{ runner.arch }}.app.zip" SeedNexusData.app
          rm -rf NexusHotel.app SeedNexusData.app
          cd ..

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
